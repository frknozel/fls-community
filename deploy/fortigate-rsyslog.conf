# Separate rsyslog instance; does not change Ubuntu's system log service.
# raw is the original syslog message as stored by rsyslog, without TCP framing.
global(
    workDirectory="/srv/fls-server/queue"
    maxMessageSize="256k"
    parser.escapeControlCharactersOnReceive="off"
    parser.dropTrailingLFOnReception="off"
    net.enableDNS="off"
)
$RepeatedMsgReduction off

# A failed dynamic file must suspend/retry rather than discard the event.
# See https://docs.rsyslog.com/doc/reference/parameters/omfile-dynafile-donotsuspend.html
module(load="builtin:omfile" dynafile.donotsuspend="off")
module(load="imtcp" MaxSessions="64" MaxFrameSize="262144")
# Root-owned exact-IP table. HUP reloads permissions without restarting the listener.
lookup_table(name="fls_senders" file="/etc/fortigate/fls-senders.json" reloadOnHUP="on")

template(name="FGEnvelope" type="list" option.jsonf="on") {
    constant(outname="schema_version" value="1" format="jsonf")
    property(outname="received_at" name="timegenerated" dateFormat="rfc3339" format="jsonf")
    property(outname="sender_ip" name="fromhost-ip" format="jsonf")
    constant(outname="transport" value="tcp" format="jsonf")
    property(outname="raw" name="rawmsg" format="jsonf")
}
template(name="FGHourlyFile" type="string"
    string="/srv/fls-server/raw/%timegenerated:1:10:date-rfc3339%-%timegenerated:12:13:date-rfc3339%.jsonl")
template(name="FGStatsFile" type="string"
    string="/srv/fls-server/metrics/%timegenerated:1:10:date-rfc3339%-rsyslog.jsonl")

ruleset(name="fg_stats") {
    action(type="omfile" dynaFile="FGStatsFile" template="RSYSLOG_FileFormat"
        fileCreateMode="0640" dirCreateMode="0750")
    stop
}
module(load="impstats" interval="60" resetCounters="off"
    format="json" log.syslog="on" ruleset="fg_stats")

ruleset(name="fortigate"
    queue.type="Disk"
    queue.filename="fg-receive"
    queue.spoolDirectory="/srv/fls-server/queue"
    queue.maxDiskSpace="10g"
    queue.maxFileSize="64m"
    queue.checkpointInterval="1"
    queue.syncQueueFiles="on"
    queue.saveOnShutdown="on"
    queue.workerThreads="1"
    queue.dequeueBatchSize="512"
    queue.minDequeueBatchSize="64"
    queue.minDequeueBatchSize.timeout="200"
    queue.timeoutEnqueue="-1"
) {
    # Sender admission occurs before this durable queue. Already accepted records survive permission changes.
    # Requires the collector-private checked-write build; see queue-fix-20261019.
    # Every failed transaction is retried; disk sync remains enabled.
    action(name="fg_raw_archive" type="omfile"
        dynaFile="FGHourlyFile" template="FGEnvelope"
        fileCreateMode="0640" createDirs="off"
        ioBufferSize="2m"
        asyncWriting="off" flushOnTXEnd="on" sync="on"
        action.resumeRetryCount="-1" action.resumeInterval="5"
        action.reportSuspension="on"
        action.reportSuspensionContinuation="on"
    )
    stop
}

# Direct admission rejects unknown sources before they can enter the durable queue.
ruleset(name="fg_admission" queue.type="Direct") {
    if (lookup("fls_senders", $fromhost-ip) != "allow") then { stop }
    call fortigate
    stop
}

# Internal errors stay separate from source records.
action(type="omfile" file="/srv/fls-server/metrics/collector-internal.log"
    template="RSYSLOG_FileFormat" fileCreateMode="0640")

input(type="imtcp" name="fortigate_tcp"
    Address="192.0.2.2" Port="5514"
    Ruleset="fg_admission" SupportOctetCountedFraming="on"
    FlowControl="on" KeepAlive="on")
